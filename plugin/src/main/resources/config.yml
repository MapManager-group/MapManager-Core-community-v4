language: zh_CN # langs/<语言代码>.yml；缺失条目回退到内置 zh_CN

storage:
  type: json # json | mysql
  # 显式后端迁移：变更 type 时填原后端 json/mysql；完成后清空。
  migrate-from: ''
  # 原后端为 MySQL 时填写原连接；与 storage-backend.txt 的目标必须一致。
  migration-source:
    mysql:
      host: localhost
      port: 3306
      database: mapmanager
      username: mapmanager
      password: change-me
      use-ssl: true
  mysql:
    host: localhost
    port: 3306
    database: mapmanager
    username: mapmanager
    password: change-me
    use-ssl: true

deletion:
  # 仅允许删除名称以 _bak 结尾的地图；使用 Java 正则，匹配整个地图名。
  allowed-world-name-regex: '.*_bak$'

creation:
  # 额外禁止创建或导入的地图名；Java 正则匹配整个名称。内置保留名始终生效。
  blocked-world-name-regex: '.*_bak$'

access-control:
  # 严格校验地图进入权限；关闭后传送、登录、重生和撤权后的强制移出均停用。
  strict-map-entry: true

migration:
  # v3 迁移只生成差异报告；设置 false 或控制台执行 /mapadmin migration apply 才写入。
  dry-run: false
